services:
  # Django Web Service
  - type: web
    name: breathe-esg-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt && python manage.py migrate --noinput && python seed.py"
    startCommand: "cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true

  # React Static Site
  - type: web
    name: breathe-esg-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: breathe-esg-backend
          property: host
